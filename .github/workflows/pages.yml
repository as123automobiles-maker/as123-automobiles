name: Deploy to GitHub Pages

# Builds the app and publishes dist/ to GitHub Pages on every push to main.
# Needs (Settings -> Secrets and variables -> Actions):
#   variable VITE_SUPABASE_URL       e.g. https://<ref>.supabase.co
#   secret   VITE_SUPABASE_ANON_KEY  the publishable/anon key (never the service_role key)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check Supabase settings
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          [ -n "$VITE_SUPABASE_URL" ] || { echo "::error::Add the VITE_SUPABASE_URL repository variable (see README)."; exit 1; }
          [ -n "$VITE_SUPABASE_ANON_KEY" ] || { echo "::error::Add the VITE_SUPABASE_ANON_KEY repository secret (see README)."; exit 1; }
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # The site is served from https://<user>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # GitHub Pages has no rewrites: serve the app for unknown paths (e.g. /bills/123 after a refresh).
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
